<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>KN Vet - รีเช็คที่อยู่ & พิมพ์ป้าย</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; }
  body {
    font-family:'Sarabun','Tahoma',sans-serif;
    background:#f2f3f5; color:#1a1a1a;
    padding-bottom:84px; /* space for sticky bar */
  }
  header {
    background:#fff; padding:14px 16px 12px; border-bottom:1px solid #eee;
    position:sticky; top:0; z-index:20;
  }
  header h1 { font-size:17px; margin:0 0 2px; }
  header .sub { font-size:12px; color:#777; }
  header .gear { float:right; font-size:20px; cursor:pointer; }

  .wrap { padding:12px; max-width:640px; margin:0 auto; }

  .toolbar {
    display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;
  }
  .toolbar input[type=date] {
    flex:1; min-width:120px; padding:9px 8px; border:1px solid #ddd; border-radius:8px; font-size:13px; font-family:inherit;
  }
  .toolbar button {
    padding:9px 14px; border:none; border-radius:8px; font-size:13px; font-weight:600;
  }
  .btn-load { background:#2563eb; color:#fff; flex:0 0 auto; }

  .count-line { font-size:12.5px; color:#888; margin:6px 2px 4px; display:flex; align-items:center; gap:6px; }
  .count-line .live-dot { width:7px; height:7px; border-radius:50%; background:#16a34a; display:inline-block; }
  .count-line .refresh-note { color:#aaa; margin-left:auto; font-size:11px; }

  .card {
    background:#fff; border-radius:12px; padding:14px; margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .card-top .who { flex:1; min-width:0; }
  .card-top .name { font-size:15px; font-weight:700; line-height:1.3; }
  .card-top .serial { font-size:12px; color:#888; margin-top:1px; }
  .incl-toggle {
    flex:0 0 auto; width:44px; height:26px; background:#e5e7eb; border-radius:20px;
    position:relative; cursor:pointer; transition:.2s;
  }
  .incl-toggle.on { background:#16a34a; }
  .incl-toggle .knob {
    position:absolute; top:2px; left:2px; width:22px; height:22px; background:#fff; border-radius:50%;
    transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .incl-toggle.on .knob { left:20px; }

  .seg {
    display:flex; background:#f1f2f4; border-radius:9px; padding:3px; margin-top:12px; gap:3px;
  }
  .seg button {
    flex:1; border:none; background:transparent; padding:9px 6px; border-radius:7px;
    font-size:12.5px; font-weight:600; color:#555; cursor:pointer; font-family:inherit;
  }
  .seg button.active { background:#fff; color:#2563eb; box-shadow:0 1px 2px rgba(0,0,0,.12); }

  .addr-preview {
    font-size:12.5px; color:#555; margin-top:10px; line-height:1.5;
    background:#fafafa; border-radius:8px; padding:8px 10px;
  }
  .addr-preview.missing { color:#b45309; background:#fffbeb; }

  .manual-fields { margin-top:10px; display:none; }
  .manual-fields.show { display:block; }
  .manual-fields label { display:block; font-size:11.5px; color:#666; margin:8px 0 3px; }
  .manual-fields input, .manual-fields textarea {
    width:100%; padding:8px 9px; border:1px solid #ddd; border-radius:7px; font-size:13.5px; font-family:inherit;
  }
  .manual-fields textarea { min-height:56px; resize:vertical; }

  .empty-state { text-align:center; color:#999; font-size:13px; padding:40px 20px; }

  /* Sticky bottom action bar */
  .bottombar {
    position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #eee;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex; gap:10px; z-index:30; box-shadow:0 -2px 8px rgba(0,0,0,.06);
  }
  .bottombar .info { flex:1; display:flex; flex-direction:column; justify-content:center; font-size:11.5px; color:#777; }
  .bottombar .info b { font-size:14px; color:#1a1a1a; }
  .bottombar button {
    border:none; border-radius:9px; padding:0 16px; font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .btn-preview { background:#eef2ff; color:#2563eb; }
  .btn-export { background:#16a34a; color:#fff; }

  /* Modal (settings) */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:flex-end; justify-content:center; z-index:100; }
  .modal.show { display:flex; }
  .modal-box { background:#fff; border-radius:16px 16px 0 0; padding:20px; width:100%; max-width:480px; max-height:85vh; overflow:auto; }
  .modal-box h3 { margin-top:0; font-size:16px; }
  .modal-box label { display:block; font-size:12px; color:#666; margin:10px 0 4px; }
  .modal-box input, .modal-box select, .modal-box textarea { width:100%; padding:9px; border:1px solid #ddd; border-radius:8px; font-size:14px; font-family:inherit; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  .modal-actions button { padding:9px 16px; border:none; border-radius:8px; font-size:13.5px; font-weight:600; }
  .btn-cancel { background:#f1f2f4; color:#333; }
  .btn-save { background:#2563eb; color:#fff; }

  /* Preview modal */
  #previewModal .modal-box { max-height:92vh; }
  #previewScroll { overflow:auto; max-height:70vh; background:#e9eaec; border-radius:8px; padding:12px 0; }
  .sheet {
    width:100mm; height:150mm; display:flex; flex-direction:column; background:#fff;
    margin:0 auto 14px; box-shadow:0 1px 4px rgba(0,0,0,.2); position:relative;
    transform-origin:top center;
  }
  .cut-line { position:absolute; top:50%; left:0; right:0; border-top:1px dashed #bbb; }
  .label-half { width:100mm; height:75mm; padding:4mm 6mm; display:flex; flex-direction:column; }
  .label-half.empty { visibility:hidden; }
  .from-block { font-size:7pt; line-height:1.25; color:#333; border-bottom:1px solid #333; padding-bottom:2mm; margin-bottom:3mm; }
  .from-block .tag { font-size:6.5pt; color:#666; }
  .from-block .name { font-weight:700; }
  .to-tag { font-size:8pt; color:#333; margin-bottom:1.5mm; }
  .to-block { flex:1; }
  .to-block .name { font-size:11.5pt; font-weight:700; line-height:1.3; margin-bottom:1.5mm; word-break:break-word; }
  .to-block .addr { font-size:9.5pt; line-height:1.4; white-space:pre-wrap; word-break:break-word; }
  .to-block .phone { font-size:9.5pt; margin-top:2mm; font-weight:600; }
  .to-block .ref { font-size:7pt; color:#888; margin-top:2mm; }

  .toast { position:fixed; top:12px; left:50%; transform:translateX(-50%) translateY(-10px); background:#1a1a1a; color:#fff;
    padding:10px 18px; border-radius:20px; font-size:13px; opacity:0; transition:.25s; z-index:200; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media print {
    body { padding:0 !important; margin:0 !important; }
    header, .wrap, .bottombar, .modal, .toast { display:none !important; }
    #printArea { display:block !important; }
    .sheet { box-shadow:none; margin:0; transform:none !important; }
    .sheet:not(:last-child) { page-break-after: always; }
    @page { size:100mm 150mm; margin:0; }
  }
</style>
</head>
<body>

<header>
  <span class="gear" onclick="document.getElementById('settingsModal').classList.add('show')">⚙</span>
  <h1>รีเช็คที่อยู่ & พิมพ์ป้าย</h1>
  <div class="sub">KN Vet · ดึงออเดอร์มารีเช็คทีละใบ ก่อน Export PDF</div>
</header>

<div class="wrap">
  <div class="toolbar">
    <button class="btn-load" onclick="loadOrders()">🔄 รีเฟรชตอนนี้</button>
  </div>
  <div class="count-line" id="countLine">
    <span class="live-dot"></span>ยังไม่ได้โหลดออเดอร์
    <span class="refresh-note">ดึงล่าสุด 10 ออเดอร์ · รีเฟรชอัตโนมัติทุก 1 ชม.</span>
  </div>

  <div id="cardList"></div>
</div>

<div class="bottombar">
  <div class="info"><span>รวมในรอบนี้</span><b><span id="selCount">0</span> รายการ</b></div>
  <button class="btn-preview" onclick="openPreview()">ดู Preview</button>
  <button class="btn-export" onclick="doPrint()">Export PDF</button>
</div>

<!-- Settings -->
<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h3>⚙ ตั้งค่า</h3>
    <label>โหมด</label>
    <select id="apiMode">
      <option value="demo">Demo (ทดสอบ ไม่ต้องมี API จริง)</option>
      <option value="live">Live (เชื่อม Flowaccount จริง)</option>
    </select>
    <label>Cloudflare Worker URL</label>
    <input id="workerUrl" placeholder="https://xxx.workers.dev">
    <label>Client ID</label>
    <input id="cfClientId">
    <label>Client Secret</label>
    <input id="cfClientSecret" type="password">
    <hr style="margin:16px 0;border:none;border-top:1px solid #eee;">
    <label>ชื่อบริษัท/ผู้ส่ง</label>
    <input id="senderName" value="KN VET SUPPLY CO., LTD.">
    <label>โทร. ผู้ส่ง</label>
    <input id="senderPhone" value="092-8604433">
    <label>ที่อยู่ผู้ส่ง</label>
    <textarea id="senderAddr" rows="2"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="document.getElementById('settingsModal').classList.remove('show')">ปิด</button>
      <button class="btn-save" onclick="saveSettings()">บันทึก</button>
    </div>
  </div>
</div>

<!-- Preview -->
<div class="modal" id="previewModal">
  <div class="modal-box">
    <h3>ตัวอย่างป้าย (100×150mm ต่อแผ่น)</h3>
    <div id="previewScroll"><div id="previewSheets"></div></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="document.getElementById('previewModal').classList.remove('show')">ปิด</button>
      <button class="btn-save" onclick="doPrint()">Export PDF</button>
    </div>
  </div>
</div>

<div id="printArea" style="display:none;"></div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
// CONFIG (shared localStorage key with Pack Station: psCfg)
// ══════════════════════════════════════════════════════════════
let cfg = JSON.parse(localStorage.getItem('psCfg') || '{"mode":"demo","env":"/test","workerUrl":"","cid":"","cs":"","token":"","texp":0}');
document.getElementById('apiMode').value = cfg.mode || 'demo';
document.getElementById('workerUrl').value = cfg.workerUrl || '';
document.getElementById('cfClientId').value = cfg.cid || '';
document.getElementById('cfClientSecret').value = cfg.cs || '';

let senderCfg = JSON.parse(localStorage.getItem('lpSender') || 'null');
if (senderCfg) {
  document.getElementById('senderName').value = senderCfg.name || '';
  document.getElementById('senderPhone').value = senderCfg.phone || '';
  document.getElementById('senderAddr').value = senderCfg.addr || '';
}

function saveSettings() {
  cfg.mode = document.getElementById('apiMode').value;
  cfg.workerUrl = document.getElementById('workerUrl').value.trim().replace(/\/+$/,'');
  cfg.cid = document.getElementById('cfClientId').value.trim();
  cfg.cs = document.getElementById('cfClientSecret').value.trim();
  localStorage.setItem('psCfg', JSON.stringify(cfg));
  senderCfg = {
    name: document.getElementById('senderName').value.trim(),
    phone: document.getElementById('senderPhone').value.trim(),
    addr: document.getElementById('senderAddr').value.trim()
  };
  localStorage.setItem('lpSender', JSON.stringify(senderCfg));
  document.getElementById('settingsModal').classList.remove('show');
  toast('บันทึกแล้ว');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2000);
}

// ══════════════════════════════════════════════════════════════
// DEMO DATA
// ══════════════════════════════════════════════════════════════
const DEMO_LIST = [
  { serial:'INV2024100088', contactName:'บริษัท สมศรี จำกัด', address:'88/1 ถ.สุขุมวิท ต.บางนา อ.บางนา จ.กรุงเทพฯ', postcode:'10260', phone:'081-2345678', contactPerson:'คุณสมศรี' },
  { serial:'INV2024100089', contactName:'โรงพยาบาลสัตว์หทัยรักษ์', address:'', postcode:'', phone:'', contactPerson:'' },
  { serial:'INV2024100090', contactName:'คลินิกหมอไอรักษาสัตว์', address:'562/8 หมู่ 14 ถ.สายในเมือง ต.บ้านอ้อมแก้ว จ.อุดรธานี 30110', postcode:'', phone:'061-3892166', contactPerson:'หมอไอ' },
  { serial:'INV2024100091', contactName:'บริษัท เพชร วิช สัตวแพทย์ จำกัด', address:'2,4 ถ.เพชรบุรีตัดใหม่ ต.บางกะปิ จ.กรุงเทพฯ', postcode:'10240', phone:'092-8604133', contactPerson:'' },
  { serial:'INV2024100092', contactName:'คลินิกหมอบังอิจักษาสัตว์', address:'', postcode:'', phone:'085-3626289', contactPerson:'' },
  { serial:'INV2024100093', contactName:'คลินิกรักษาสัตว์เลี้ยงสุขใจ', address:'19/4 ถ.มิตรภาพ ต.ในเมือง อ.เมือง จ.นครราชสีมา 30000', postcode:'', phone:'044-255789', contactPerson:'คุณสุขใจ' },
  { serial:'INV2024100094', contactName:'บริษัท ฟาร์มาเวท จำกัด', address:'', postcode:'', phone:'', contactPerson:'' },
  { serial:'INV2024100095', contactName:'โรงพยาบาลสัตว์แม่โจ้', address:'155 ถ.เชียงใหม่-พร้าว ต.แม่เหียะ อ.เมือง จ.เชียงใหม่', postcode:'50100', phone:'053-878900', contactPerson:'คุณแม่โจ้' },
  { serial:'INV2024100096', contactName:'คลินิกหมอพลอยรักสัตว์', address:'', postcode:'', phone:'089-7712345', contactPerson:'' },
  { serial:'INV2024100097', contactName:'บริษัท สัตวแพทย์ก้าวหน้า จำกัด', address:'88 ถ.พระราม 2 ต.บางมด อ.จอมทอง จ.กรุงเทพฯ 10150', postcode:'', phone:'02-4567890', contactPerson:'คุณก้าวหน้า' }
];

let orders = []; // {serial, contactName, headerAddr, headerPhone, mode:'header'|'manual', manualAddr, manualPhone, include:false} — user ticks each one manually

// ══════════════════════════════════════════════════════════════
// FIELD GUESSING (live mode) — FlowAccount field names uncertain,
// try common candidates. Raw response logged to console for reference.
// ══════════════════════════════════════════════════════════════
function guessAddress(raw) {
  return raw.contactAddress || raw.address || raw.billingAddress ||
         raw.customerAddress || (raw.contact && raw.contact.address) || '';
}
function guessPhone(raw) {
  return raw.contactNumber || raw.contactTel || raw.contactPhone || raw.tel || raw.phone ||
         raw.customerTel || (raw.contact && raw.contact.tel) || '';
}
function guessPostcode(raw) {
  return raw.contactZipCode || raw.postcode || raw.postalCode || raw.zipcode || raw.zipCode ||
         raw.contactPostcode || (raw.contact && (raw.contact.postcode || raw.contact.postalCode)) || '';
}
function guessContactPerson(raw) {
  return raw.contactPerson || raw.attentionName || raw.contactPersonName ||
         raw.attention || (raw.contact && (raw.contact.contactPerson || raw.contact.name)) || '';
}
function withPostcode(addr, postcode) {
  if (!postcode) return addr;
  if (!addr) return postcode;
  return addr.includes(postcode) ? addr : addr.trim() + ' ' + postcode;
}

async function getToken() {
  if (cfg.mode === 'demo') return 'demo';
  const now = Date.now();
  if (cfg.token && cfg.texp && now < cfg.texp - 300000) return cfg.token;
  if (!cfg.cid || !cfg.cs) { toast('ตั้งค่า Client ID/Secret ก่อน'); document.getElementById('settingsModal').classList.add('show'); return null; }
  try {
    const apiBase = (cfg.workerUrl && cfg.workerUrl.startsWith('http') ? cfg.workerUrl : 'https://openapi.flowaccount.com') + (cfg.env || '/test');
    const r = await fetch(apiBase + '/token', {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({grant_type:'client_credentials',scope:'flowaccount-api',client_id:cfg.cid,client_secret:cfg.cs})
    });
    if (!r.ok) { toast('Client ID/Secret ไม่ถูกต้อง'); return null; }
    const j = await r.json();
    cfg.token = j.access_token; cfg.texp = Date.now() + (j.expires_in||3600)*1000;
    localStorage.setItem('psCfg', JSON.stringify(cfg));
    return cfg.token;
  } catch(e) { toast('เชื่อมต่อ Flowaccount ไม่ได้'); return null; }
}

const ORDER_LIMIT = 10;

async function loadOrders(isAuto) {
  if (!isAuto) document.getElementById('countLine').innerHTML = '<span class="live-dot"></span>กำลังโหลด...';
  let list = [];
  if (cfg.mode === 'demo') {
    await new Promise(r=>setTimeout(r,400));
    list = DEMO_LIST.slice(0, ORDER_LIMIT);
  } else {
    const token = await getToken();
    if (!token) { setCountLine('โหลดไม่สำเร็จ'); return; }
    const base = (cfg.workerUrl && cfg.workerUrl.startsWith('http') ? cfg.workerUrl : 'https://openapi.flowaccount.com') + (cfg.env || '/test');
    const url = `${base}/tax-invoices?page=1&limit=${ORDER_LIMIT}`;
    try {
      const r = await fetch(url, { headers:{'Authorization':'Bearer '+token} });
      if (!r.ok) { toast('โหลดออเดอร์ไม่สำเร็จ ('+r.status+')'); setCountLine('โหลดไม่สำเร็จ'); return; }
      const j = await r.json();
      const rawList = j.data?.list || j.data?.items || [];
      console.log('[LabelReview] raw list:', rawList); // เช็คชื่อ field จริงถ้า address/phone ไม่ขึ้น
      list = rawList.slice(0, ORDER_LIMIT).map(raw => ({
        serial: raw.documentSerial,
        contactName: raw.contactName,
        address: guessAddress(raw),
        phone: guessPhone(raw),
        postcode: guessPostcode(raw),
        contactPerson: guessContactPerson(raw)
      }));
    } catch(e) { toast('เชื่อมต่อ API ไม่ได้'); setCountLine('โหลดไม่สำเร็จ'); return; }
  }

  // merge: keep existing tick/manual edits for orders already in the list,
  // add new ones on top. Never silently discard what the user already filled in.
  const existingBySerial = {};
  orders.forEach(o => existingBySerial[o.serial] = o);

  const merged = list.map(d => {
    const prev = existingBySerial[d.serial];
    if (prev) {
      // refresh header info in case it changed, keep user's choices
      prev.headerAddr = d.address || prev.headerAddr;
      prev.headerPhone = d.phone || prev.headerPhone;
      prev.headerPostcode = d.postcode || prev.headerPostcode;
      prev.headerContactPerson = d.contactPerson || prev.headerContactPerson;
      prev.contactName = d.contactName || prev.contactName;
      return prev;
    }
    return {
      serial: d.serial, contactName: d.contactName,
      headerAddr: d.address || '', headerPhone: d.phone || '',
      headerPostcode: d.postcode || '', headerContactPerson: d.contactPerson || '',
      mode: d.address ? 'header' : 'manual',
      manualAddr: '', manualPhone: d.phone || '',
      include: false
    };
  });

  orders = merged;
  renderCards();
  setCountLine();
  if (isAuto) toast('รีเฟรชออเดอร์อัตโนมัติแล้ว');
}

function setCountLine(customMsg) {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('countLine').innerHTML = customMsg
    ? '<span class="live-dot" style="background:#dc2626;"></span>' + customMsg
    : `<span class="live-dot"></span>โหลดล่าสุด ${orders.length} ออเดอร์ · อัปเดตเมื่อ ${timeStr} <span class="refresh-note">รีเฟรชอัตโนมัติทุก 1 ชม.</span>`;
}

// Auto-load on open, then auto-refresh every hour
window.addEventListener('load', () => {
  loadOrders(false);
  setInterval(() => loadOrders(true), 60 * 60 * 1000);
});

// ══════════════════════════════════════════════════════════════
// CARDS
// ══════════════════════════════════════════════════════════════
function renderCards() {
  const list = document.getElementById('cardList');
  if (orders.length === 0) {
    list.innerHTML = '<div class="empty-state">กำลังโหลดออเดอร์ล่าสุด...</div>';
    updateSelCount();
    return;
  }
  list.innerHTML = orders.map((o,i) => `
    <div class="card">
      <div class="card-top">
        <div class="who">
          <div class="name">${escapeHtml(o.contactName)}</div>
          <div class="serial">${escapeHtml(o.serial)}</div>
        </div>
        <div class="incl-toggle ${o.include?'on':''}" onclick="toggleInclude(${i})"><div class="knob"></div></div>
      </div>
      <div class="seg">
        <button class="${o.mode==='header'?'active':''}" onclick="setMode(${i},'header')">ที่อยู่ตามหัวใบกำกับภาษี</button>
        <button class="${o.mode==='manual'?'active':''}" onclick="setMode(${i},'manual')">ที่อยู่จัดส่งอื่น</button>
      </div>
      ${o.mode==='header' ? `
        <div class="addr-preview ${o.headerAddr?'':'missing'}">
          ${o.headerAddr ? escapeHtml(withPostcode(o.headerAddr, o.headerPostcode)) + (o.headerContactPerson?'<br>ผู้ติดต่อ: '+escapeHtml(o.headerContactPerson):'') + (o.headerPhone?'<br>โทร. '+escapeHtml(o.headerPhone):'') : '⚠️ ไม่พบที่อยู่ในหัวบิล — กรุณาสลับไป "ที่อยู่จัดส่งอื่น" แล้วกรอกเอง'}
        </div>
      ` : `
        <div class="manual-fields show">
          <label>ที่อยู่จัดส่ง</label>
          <textarea onblur="updateManual(${i},'manualAddr',this.value)">${escapeHtml(o.manualAddr)}</textarea>
          <label>เบอร์โทร</label>
          <input value="${escapeHtml(o.manualPhone)}" onblur="updateManual(${i},'manualPhone',this.value)">
        </div>
      `}
    </div>
  `).join('');
  updateSelCount();
}

function toggleInclude(i) { orders[i].include = !orders[i].include; renderCards(); }
function setMode(i, m) { orders[i].mode = m; renderCards(); }
function updateManual(i, field, val) { orders[i][field] = val; updateSelCount(); }

function updateSelCount() {
  const n = orders.filter(o=>o.include).length;
  document.getElementById('selCount').textContent = n;
}

// ══════════════════════════════════════════════════════════════
// PREVIEW / PRINT
// ══════════════════════════════════════════════════════════════
function buildSheetsHtml() {
  const senderName = document.getElementById('senderName').value.trim();
  const senderAddr = document.getElementById('senderAddr').value.trim();
  const senderPhone = document.getElementById('senderPhone').value.trim();

  const items = orders.filter(o=>o.include).map(o => {
    const rawAddr = o.mode==='header' ? o.headerAddr : o.manualAddr;
    const addr = o.mode==='header' ? withPostcode(rawAddr, o.headerPostcode) : rawAddr;
    const phone = o.mode==='header' ? o.headerPhone : o.manualPhone;
    const contactPerson = o.mode==='header' ? o.headerContactPerson : '';
    return { name:o.contactName, addr, phone, contactPerson, ref:o.serial };
  }).filter(o=>o.addr); // skip ones missing address entirely

  function fromBlock() {
    return `<div class="from-block"><div class="tag">จาก</div><div class="name">${escapeHtml(senderName)}</div><div>${escapeHtml(senderAddr)}</div><div>โทร. ${escapeHtml(senderPhone)}</div></div>`;
  }
  function toBlock(q) {
    return `<div class="to-tag">กรุณานำส่ง</div><div class="to-block"><div class="name">${escapeHtml(q.name)}${q.contactPerson?' (ผู้ติดต่อ: '+escapeHtml(q.contactPerson)+')':''}</div><div class="addr">${escapeHtml(q.addr)}</div><div class="phone">โทร. ${escapeHtml(q.phone)}</div><div class="ref">อ้างอิง: ${escapeHtml(q.ref)}</div></div>`;
  }

  let html = '';
  for (let i=0; i<items.length; i+=2) {
    const left = items[i], right = items[i+1];
    html += `<div class="sheet">
      <div class="label-half">${fromBlock()}${toBlock(left)}</div>
      <div class="cut-line"></div>
      <div class="label-half ${right?'':'empty'}">${right ? fromBlock()+toBlock(right) : ''}</div>
    </div>`;
  }
  return { html, count: items.length, skipped: orders.filter(o=>o.include).length - items.length };
}

function openPreview() {
  const { html, count, skipped } = buildSheetsHtml();
  if (count === 0) { toast('ยังไม่มีรายการที่พร้อมพิมพ์ (เช็คว่ากรอกที่อยู่ครบหรือยัง)'); return; }
  document.getElementById('previewSheets').innerHTML = html;
  document.getElementById('previewModal').classList.add('show');
  if (skipped > 0) toast(skipped + ' รายการถูกข้าม เพราะยังไม่มีที่อยู่');
}

function doPrint() {
  const { html, count, skipped } = buildSheetsHtml();
  if (count === 0) { toast('ยังไม่มีรายการที่พร้อมพิมพ์'); return; }
  document.getElementById('printArea').innerHTML = html;
  document.getElementById('previewModal').classList.remove('show');
  setTimeout(()=>window.print(), 100);
}

function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
